<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EcoQuebrada</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/login-responsive.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- BACKGROUND -->

    <div class="background-overlay"></div>

    <!-- BOTÃO FECHAR -->

    <a href="index.html" class="close-button">

        <i class="fa-solid fa-xmark"></i>

    </a>

    <!-- CARD -->

    <main class="login-container">

        <div class="login-card">

            <!-- LOGIN -->

            <div class="form-content active" id="loginForm">

                <h1>Conecte-se</h1>

                <form id="loginformulario">

                    <div class="input-group">

                        <input
                            id="username"
                            type="text"
                            placeholder="Usuário"
                            required>

                    </div>

                    <div class="input-group password">

                        <input
                            id="loginPassword"
                            type="password"
                            placeholder="Senha"
                            required>

                        <button
                            type="button"
                            class="toggle-password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                    <div class="forgot-password">

                        <a href="#">
                            Esqueci a senha
                        </a>

                    </div>

                    
                    <button class="btn-login" type="submit">

                        Entrar

                    </button>
                   
                </form>

                <div class="divider">

                    <span>OU</span>

                </div>

                <button class="social-btn google">

                    <img src="assets/Vector-google.svg">

                    Fazer login com o Google

                </button>

                <button class="social-btn facebook">

                    <img src="assets/Facebook_Logo_Primary 1.svg">

                    Fazer login com o Facebook

                </button>

                <button
                    class="switch-form"
                    id="openRegister">

                    Criar nova conta

                </button>

                <p class="terms">

                    Ao se conectar, você concorda com nossos
                    <a href="#">Termos de Serviço</a>.

                </p>

            </div>

            <!-- CADASTRO -->

            <div class="form-content" id="registerForm">

                <h1>Criar Conta</h1>

                <form>

                    <div class="input-group">

                        <input
                            type="text"
                            placeholder="Nome completo"
                            required>

                    </div>

                    <div class="input-group">

                        <input
                            type="email"
                            placeholder="E-mail"
                            required>

                    </div>

                    <div class="input-group">

                        <input
                            id="username"
                            type="text"
                            placeholder="Nome de usuário"
                            required>

                    </div>

                    <div class="input-group password">

                        <input
                            id="registerPassword"
                            type="password"
                            placeholder="Senha"
                            required>

                        <button
                            type="button"
                            class="toggle-password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                    <div class="input-group password">

                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="Confirmar senha"
                            required>

                        <button
                            type="button"
                            class="toggle-password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                    <button
                        class="btn-login"
                        type="submit">

                        Criar Conta

                    </button>

                </form>

                <button
                    class="switch-form"
                    id="backLogin">

                    Já possui uma conta? Entrar

                </button>

            </div>

        </div>

    </main>

    <!-- FOOTER -->

    <footer>

        <div class="footer-left">

            <h2>2026</h2>

            <span>FEITO POR</span>

            <p>

                Agda Oliveira

                <span>●</span>

                Rosana Ferreira

                <span>●</span>

                Maria Eduarda

                <span>●</span>

                Polliana Machado

                <span>●</span>

                José Victor

            </p>

        </div>

        <div class="footer-right">

            <img
                src="assets/Logo-white.svg"
                alt="EcoQuebrada">

        </div>

    </footer>

    <script src="script/login.js"></script>
    <script src="script/navbar.js"></script>

</body>

</html>
